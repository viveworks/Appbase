# Public contributor build evidence (internal work item 1431, AC12, N05 of internal work item 1009's public-repository export gate).
#
# This workflow runs automatically on every pull request, by design: it is the one hosted check
# an outside fork contributor can actually trigger. internal work item 1431's own acceptance criterion is
# `on: pull_request`, "prove on a real fork PR" -- a contributor has no write access to dispatch
# a workflow_dispatch-only check in the upstream repo, so that trigger type would make this
# workflow unreachable for the exact audience it exists to serve.
#
# ⚠️ THIS IS A DELIBERATE, NAMED EXCEPTION to internal work item 3023's "all hosted CI is dispatch-only" policy for
# this personal repository -- not an oversight, and not a reversal of internal work item 3023 for anything else.
# internal work item 3023's own scope statement ("the org repo viveworks/Appbase is out of scope") did not account
# for this file's own export classification: it is exported verbatim into the public org repo,
# where it is the only hosted check an external contributor can run at all. internal work item 3024 (the PR that
# executed internal work item 3023) swept this file's trigger to workflow_dispatch along with four purely-internal
# workflows without that cross-check, silently regressing internal work item 1431's own AC. Restoring `pull_request`
# here is deliberate and narrow: it reinstates the one thing internal work item 1431's AC always required, and it
# does not touch ci-verify.yml or the other four workflows internal work item 3023 covers.
#
# ⚠️ THIS IS NOT ci-verify.yml. That workflow is an internal REVIEW GATE, workflow_dispatch-only
# because a full run costs real Actions minutes and this repo's own agents dispatch it explicitly
# with a validated head SHA. An outside contributor does not know that convention and should not
# have to. The two workflows are deliberately independent: a change to one's trigger logic must
# not silently change the other's.
#
# It never uses `pull_request_target`, repository secrets, or write permissions.
# The public export policy is separate and remains outside this personal-repository change.
#
# `--mode develop` is PINNED, not left to build.sh's "quick" default: it is the one mode that runs
# unit tests AND the coverage gate (jacoco.coveredRatio, pom.xml), which is what AC12 asks a
# contributor's PR to prove. build.sh itself already fails loudly (named "unknown mode" error, exit
# 1) on anything it does not recognise, and a private-side regression test proves that by mutation
# and also proves this pin still matches one of build.sh's real modes, so a rename on build.sh's
# side cannot drift silently out of step with this workflow.
name: Public contributor CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-unit-coverage:
    name: build + unit tests + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # No explicit `ref:` here -- actions/checkout's own default on a pull_request event is the
      # synthetic PR MERGE ref (base + head merged), not the raw PR head SHA. That is the right
      # contributor-CI choice (it tests what would land, including conflicts with the current
      # base), but say so accurately: pr_workflow_pin_test.sh proves no ref: override is present,
      # not that this checks out the head commit by itself.
      - name: Check out the pull request merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Install ripgrep for build.sh bounded manifest scan
        run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version

      - name: build.sh --mode develop (unit tests + coverage gate)
        run: ./build.sh --mode develop
