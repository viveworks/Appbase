# Fork-safe public pull-request licence policy using GitHub's trusted dependency graph.
name: Licence change

on:
  pull_request:
  public:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    # GitHub's dependency-review-action requires the Dependency graph, which on a PRIVATE repo
    # needs GitHub Advanced Security (a licensed org feature) -- it is free/automatic only once
    # the repo is actually public. Owner ruling: skip this job while private (the owner's own
    # dependency analysis stands in for now) rather than leave it red forever or need a manual
    # re-enable later. This resumes on the next applicable `pull_request` run once the repo is
    # public -- NOT the instant visibility flips: a check that already completed (even as
    # `skipped`) while private does not get a new run just because visibility later changes.
    # The publication-sweep jobs below are the durable mechanism that closes that gap.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency licence changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: false
          license-check: true
          allow-licenses: >-
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, CDDL-1.0, CDDL-1.1,
            EPL-1.0, EPL-2.0, ISC, LicenseRef-Public-Domain, MIT, MIT-0, MPL-1.1,
            MPL-2.0, W3C
      - name: Fail closed on missing or unresolved licence metadata
        if: always()
        env:
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get('INVALID_LICENSE_CHANGES', '')
          if not raw.strip():
              raise SystemExit('dependency review produced no invalid-license-changes output')
          try:
              changes = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit(f'invalid-license-changes is malformed JSON: {error}')
          required = ('forbidden', 'unresolved', 'unlicensed')
          if not isinstance(changes, dict) or any(
                  key not in changes or not isinstance(changes[key], list) for key in required):
              raise SystemExit('invalid-license-changes has an unexpected schema')
          unknown = changes['unresolved'] + changes['unlicensed']
          if unknown:
              raise SystemExit('dependency licences unresolved or unlicensed: ' + repr(unknown))
          if changes['forbidden']:
              raise SystemExit('dependency review reported forbidden licences')
          print('dependency licence metadata resolved and policy-compliant')
          PY

  publication-sweep-enumerate:
    # Fires exactly once, on the GitHub `public` event (repository visibility private -> public).
    # Explicitly paginated well past gh's default 30-item page (not a silent truncation) -- the
    # bound is named here, not implicit.
    if: github.event_name == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr_numbers: ${{ steps.list.outputs.pr_numbers }}
    steps:
      - name: Enumerate every currently open PR
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          numbers_json="$(gh pr list --repo "${{ github.repository }}" --state open --limit 1000 --json number --jq '[.[].number]')"
          count="$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$numbers_json")"
          echo "publication-sweep: $count open PR(s) found"
          # GitHub caps a matrix at 256 jobs per workflow run -- fail loudly and name the real
          # bound instead of silently handing a matrix generator more than it can run (which
          # would either error opaquely or, worse, silently process only a subset). This is a
          # one-time, owner-triggered event; a repo with over 256 open PRs at that exact moment
          # needs a deliberate multi-wave dispatch, not a silent partial sweep.
          if [ "$count" -gt 256 ]; then
            echo "publication-sweep: REFUSING -- $count open PRs exceeds GitHub's 256-job matrix cap; this sweep cannot process all of them in one run" >&2
            exit 1
          fi
          echo "pr_numbers=$numbers_json" >> "$GITHUB_OUTPUT"

  publication-sweep-recheck:
    needs: publication-sweep-enumerate
    if: github.event_name == 'public' && needs.publication-sweep-enumerate.outputs.pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.publication-sweep-enumerate.outputs.pr_numbers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Scoped per-PR, not per-job: if `public` somehow fires more than once (publish ->
    # unpublish -> republish), two sweeps' matrix entries for the SAME PR queue behind each
    # other instead of racing to POST a Check Run for it with no ordering guarantee between
    # them -- while entries for DIFFERENT PRs, in the same run or different runs, still run
    # fully in parallel (this key does not collapse the whole matrix into one lane).
    concurrency:
      group: publication-sweep-${{ github.repository }}-${{ matrix.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Resolve this PR's current base/head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              pr = json.load(handle)
          print(f"base_sha={pr['base']['sha']}")
          print(f"head_sha={pr['head']['sha']}")
          PY
      - name: Review dependency licence changes
        id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.resolve.outputs.base_sha }}
          head-ref: ${{ steps.resolve.outputs.head_sha }}
          vulnerability-check: false
          license-check: true
          allow-licenses: >-
            Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, CDDL-1.0, CDDL-1.1,
            EPL-1.0, EPL-2.0, ISC, LicenseRef-Public-Domain, MIT, MIT-0, MPL-1.1,
            MPL-2.0, W3C
      - name: Determine the fail-closed verdict
        id: verdict
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          INVALID_LICENSE_CHANGES: ${{ steps.review.outputs.invalid-license-changes }}
        run: |
          python3 - <<'PY'
          import json, os
          out = os.environ['GITHUB_OUTPUT']
          def finish(conclusion, summary):
              with open(out, 'a', encoding='utf-8') as handle:
                  handle.write(f'conclusion={conclusion}\n')
                  handle.write(f'summary<<EOF_SUMMARY\n{summary}\nEOF_SUMMARY\n')
          # The action's own outcome is checked FIRST and separately from its output: a crashed
          # or erroring action can still emit a well-formed, empty-looking output object, which
          # must never be converted into a custom success just because the JSON parses clean.
          outcome = os.environ.get('REVIEW_OUTCOME', '')
          if outcome != 'success':
              finish('failure', f'dependency-review-action itself did not succeed (outcome={outcome!r})')
              raise SystemExit(0)
          raw = os.environ.get('INVALID_LICENSE_CHANGES', '')
          if not raw.strip():
              finish('failure', 'dependency review produced no invalid-license-changes output')
              raise SystemExit(0)
          try:
              changes = json.loads(raw)
          except json.JSONDecodeError as error:
              finish('failure', f'invalid-license-changes is malformed JSON: {error}')
              raise SystemExit(0)
          required = ('forbidden', 'unresolved', 'unlicensed')
          if not isinstance(changes, dict) or any(
                  key not in changes or not isinstance(changes[key], list) for key in required):
              finish('failure', 'invalid-license-changes has an unexpected schema')
              raise SystemExit(0)
          unknown = changes['unresolved'] + changes['unlicensed']
          if unknown:
              finish('failure', 'dependency licences unresolved or unlicensed: ' + repr(unknown))
          elif changes['forbidden']:
              finish('failure', 'dependency review reported forbidden licences')
          else:
              finish('success', 'dependency licence metadata resolved and policy-compliant')
          PY
      - name: Re-verify this PR's head has not moved since it was resolved
        # Closes the race the delta review named: resolve and the eventual publish below are
        # minutes apart (dependency-review-action runs in between), so a push to this PR during
        # that window must not have its OLD review silently published as if it covered the NEW
        # head. If the PR moved, skip publishing for the now-superseded head entirely rather than
        # attach a stale result to it -- the new head does not need this sweep's help: once the
        # repository is public, that push's own ordinary `pull_request` synchronize event already
        # runs the real dependency-review job directly against it.
        id: recheck
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          RESOLVED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e` on this line: if the re-verification API call itself fails
          # (transient error), that must not silently abort the step before head_moved is written
          # at all -- an empty/unset output reads as != 'true' downstream, which is fail-OPEN
          # (publishes a possibly-stale result as if the head were confirmed unmoved). Capture the
          # failure explicitly and write a third, distinct state instead, so every downstream
          # guard sees an unambiguous value no matter what happened here.
          if current_head="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)"; then
            if [ "$current_head" = "$RESOLVED_HEAD_SHA" ]; then
              echo "head_moved=false" >> "$GITHUB_OUTPUT"
            else
              echo "publication-sweep: PR #$PR_NUMBER moved from $RESOLVED_HEAD_SHA to $current_head during this sweep -- skipping publish for the superseded head; its own ordinary CI covers the new one" >&2
              echo "head_moved=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publication-sweep: could not re-verify PR #$PR_NUMBER's current head (API call failed) -- treating as unconfirmed rather than publishing a possibly-stale result" >&2
            echo "head_moved=unknown" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the result as a check run on this PR's exact head SHA
        # This is the fix for the finding that a workflow_dispatch/public-triggered run's check
        # suite attaches to the SELECTED REF's commit, never to any PR's head -- branch
        # protection's required checks are evaluated against the PR head SHA's OWN check runs, so
        # a result that lands anywhere else cannot replace the stale skipped check. Explicitly
        # creating a check run via the Checks API, with head_sha pinned to this PR's real current
        # head AND the exact required context name `dependency-review` (the same job id the
        # ordinary pull_request-triggered job already uses -- branch protection matches check
        # names, not an invented display label), attaches the result where branch protection
        # actually looks.
        if: always() && steps.recheck.outputs.head_moved == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          CONCLUSION: ${{ steps.verdict.outputs.conclusion }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/check-runs" \
            -f head_sha="$HEAD_SHA" \
            -f name="dependency-review" \
            -f status=completed \
            -f conclusion="$CONCLUSION" \
            -f "output[title]=Publication-time licence re-check" \
            -f "output[summary]=$SUMMARY" >/dev/null
      - name: Fail this PR's matrix entry if its licence re-check did not pass
        # fail-fast is false, so one PR's failure here never cancels the others -- every open PR
        # still gets its own attempt and its own check run, and this job's own result still
        # reports failure if any entry failed, which publication-sweep-rollup below surfaces. A
        # CONFIRMED head-moved entry is intentionally NOT failed here: that head is superseded,
        # and the new one already gets its own ordinary pull_request-triggered review once
        # public. An UNCONFIRMED (unknown) entry is NOT given that same pass -- we genuinely do
        # not know whether it moved, so it fails rather than silently sliding through.
        if: always()
        run: |
          moved="${{ steps.recheck.outputs.head_moved }}"
          if [ "$moved" = "true" ]; then
            exit 0
          fi
          if [ "$moved" = "unknown" ]; then
            echo "publication-sweep: PR #${{ matrix.pr_number }} -- could not confirm whether its head moved; not treating that as a pass" >&2
            exit 1
          fi
          if [ "${{ steps.verdict.outputs.conclusion }}" != "success" ]; then
            echo "publication-sweep: PR #${{ matrix.pr_number }} did not pass its re-check" >&2
            exit 1
          fi

  publication-sweep-rollup:
    needs: [publication-sweep-enumerate, publication-sweep-recheck]
    if: always() && github.event_name == 'public'
    runs-on: ubuntu-24.04
    steps:
      - name: Require every open PR's re-check to have completed successfully
        run: |
          enumerate_result="${{ needs.publication-sweep-enumerate.result }}"
          recheck_result="${{ needs.publication-sweep-recheck.result }}"
          # recheck's own `if:` has no status-check function, so a failure in enumerate --
          # including its own >256-open-PR refusal, or a transient `gh` API error -- causes
          # recheck to be auto-skipped. That is indistinguishable from recheck's OWN legitimate
          # skip-with-zero-open-PRs case unless enumerate's result is checked separately: without
          # this, a crashed enumerate silently reports "every open PR's licence re-check completed
          # successfully" while zero PRs were actually rechecked.
          if [ "$enumerate_result" != "success" ]; then
            echo "publication-sweep: enumeration did not succeed ($enumerate_result) -- no PRs were actually rechecked" >&2
            exit 1
          fi
          if [ "$recheck_result" != "success" ] && [ "$recheck_result" != "skipped" ]; then
            echo "publication-sweep: at least one open PR's licence re-check did not pass ($recheck_result)" >&2
            exit 1
          fi
          echo "publication-sweep: every open PR's licence re-check completed successfully"
