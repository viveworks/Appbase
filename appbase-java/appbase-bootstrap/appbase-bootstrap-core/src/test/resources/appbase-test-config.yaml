---
appbaseCoreServicesConfiguration:

  logServiceConfiguration:
    logbackXml: null
    defaultLogAccessorConfiguration:
      enabled: true
      logStoreConfigurations: []
    metricsTurboFilterHandlerConfiguration:
      enabled: true
      measureLogLevels: true
      measureLoggerNames: true
      allowedLoggerNames: []
      blockedLoggerNames: []
      measureFormattedMessages: false
      allowedFormattedMessages: []
      blockedFormattedMessages: []
      measureThrowableTypeNames: true
      allowedThrowableTypeNames: []
      blockedThrowableTypeNames: []
    burstTurboLogEventFilterHandlerConfiguration:
      enabled: true
      burstRateThreshold: 1000.0
      defaultLogDeduplicatorConfiguration:
        duplicateLogHandlerSchedulableConfiguration:
          enabled: true
          initialDelay: 0
          interval: 60
          timeUnit: "SECONDS"
      defaultLogRateCalculatorConfiguration:
        ewmaRate: "ONE_MINUTE"
      defaultDuplicateLogHandlerConfiguration:
        markerName: "DefaultDuplicateLogHandler"
        formattedMessageLogLevel: "INFO"
        throwableLogLevel: "ERROR"
        countTextPrefix: " (count="
        countTextSuffix: ")"
        throwableTypeNameAndMessageSeparator: " - "
        logParamsAndThrowable: true
    disruptorMediatorEventDelegatingAppenderConfiguration:
      enabled: true
    luceneLogIndexConfiguration:
      type: "com.viveworks.appbase.core.service.log.common.lucene.DefaultLuceneLogIndexConfiguration"
      enabled: false
    luceneAppenderConfiguration:
      enabled: false
    disruptorLogAndTurboLogEventFilterDelegatorConfiguration:
      enabled: true
      acceptLogAfterTurboLogEventListeners: true
      acceptLogAfterLogEventListeners: true
    duplicateLogTurboFilterHandlerConfiguration:
      enabled: false
      defaultLogDeduplicatorConfiguration:
        duplicateLogHandlerSchedulableConfiguration:
          enabled: true
          initialDelay: 0
          interval: 60
          timeUnit: "SECONDS"
      defaultDuplicateLogHandlerConfiguration:
        markerName: "DefaultDuplicateLogHandler"
        formattedMessageLogLevel: "INFO"
        throwableLogLevel: "ERROR"
        countTextPrefix: " (count="
        countTextSuffix: ")"
        throwableTypeNameAndMessageSeparator: " - "
        logParamsAndThrowable: true
    luceneLogAndTurboLogEventFilterListenerConfiguration:
      enabled: false
      indexTurboLog: false
      indexLogEvent: false

  metricServiceConfiguration:
    enableJvmAndSystemMetrics: false

  validationServiceConfiguration: {}

  mediatorServiceConfiguration:
    ignoredMessageTypeSet: []
    objectPoolCapacity: 256
    removedMessageQueueCapacity: 128
    appbaseRuntimeExceptionQueueCapacity: 128
    defaultMessageQueuesConfiguration:
      messageQueueType: "BOUND"
      boundMessageQueueCapacity: 256
      removeExpiredMessages: true
      expiredMessageThresholdMillis: 300000
      messageQueuesCleanerInitialDelayMillis: 5000
      messageQueuesCleanerIntervalMillis: 10000
    sharedExecutorServiceConfiguration:
      executorServiceType: "SINGLE_THREADED"
      fixedThreadPoolSize: 1
      threadNameFormat: "appbase-mediator-executor-%d"
      daemonThread: true
    sharedScheduledExecutorServiceConfiguration:
      scheduledExecutorServiceType: "SINGLE_THREADED"
      threadPoolSize: 1
      threadNameFormat: "appbase-mediator-scheduled-executor-%d"
      daemonThread: true

  configurationServiceConfiguration:
    enableSchedulableConfigurationAccessor: true
    configurationAccessorSchedulableConfiguration:
      enabled: true
      initialDelay: 0
      interval: 60
      timeUnit: "SECONDS"

  serviceRegistryConfiguration:
    appName: "AppbaseTest"
    enablePolling: true
    registerAsConfigurationListener: true
    pollingSchedulableConfiguration:
      enabled: true
      initialDelay: 0
      interval: 1000
      timeUnit: "MILLISECONDS"

  exceptionServiceConfiguration:
    defaultExceptionAccessorConfiguration:
      exceptionStoreConfigurations:
        - type: "com.viveworks.appbase.core.service.exception.store.inmemory.InMemoryExceptionStoreConfiguration"
          enabled: true
          discriminator: "test-discriminator"
          stackTraceSerializationMaxLength: 1024
          exceptionStoreType: "com.viveworks.appbase.core.service.exception.store.inmemory.InMemoryExceptionStore"
    defaultOldMessagesCleanerConfiguration:
      enabled: false

  tracerServiceConfiguration:
    serviceName: "AppbaseTestService"
    tags: {}
    use128BitTraceId: true
    expandExceptionLogs: true
    jaegerPropagationConfiguration:
      jaegerPropagationTypes:
        - "W3C_TRACE_CONTEXT"
      baggagePrefix: "baggage-"
    jaegerSamplerConfiguration:
      type: "com.viveworks.appbase.core.service.tracer.configuration.sampler.ConstSamplerConfiguration"
      decision: true
    jaegerReporterConfigurations:
      - type: "com.viveworks.appbase.core.service.tracer.configuration.reporter.LoggingReporterConfiguration"
        enabled: true

  jmxServiceConfiguration:
    enabled: true
    excludedMxBeanRegistrations: []
