defaultMetricServiceConfiguration:
  enableJvmAndSystemMetrics: true
defaultMediatorServiceConfiguration:
  ignoredMessageTypeSet:
  objectPoolCapacity: 256
  removedMessageQueueCapacity: 128
  appbaseRuntimeExceptionQueueCapacity: 128
  defaultMessageQueuesConfiguration:
