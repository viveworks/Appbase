---
defaultMetricServiceConfiguration:
  enableJvmAndSystemMetrics: true
defaultMediatorServiceConfiguration:
  ignoredMessageTypeSet:
  objectPoolCapacity: 256
  removedMessageQueueCapacity: 128
  appbaseRuntimeExceptionQueueCapacity: 128
  defaultMessageQueuesConfiguration:
    messageQueueType: "BOUND"
    boundMessageQueueCapacity: 256
    removeOldMessages: true
    expiredMessageThresholdMillis: 300000
    messageQueuesCleanerInitialDelayMillis: 5000
    messageQueuesCleanerIntervalMillis: 10000
defaultConfigurationServiceConfiguration:
  enableSchedulableConfigurationAccessor: true
  configurationAccessorSchedulableConfiguration:
    initialDelay: 0
    interval: 60
    timeUnit: SECONDS
defaultServiceRegistryConfiguration:
  enablePolling: true
  registerAsConfigurationListener: true
  pollingSchedulableConfiguration:
    initialDelay: 0
    interval: 1000
    timeUnit: "MILLISECONDS"
defaultExceptionServiceConfiguration:
  defaultExceptionAccessorConfiguration:
    exceptionStoreConfigurations:
      - type: "com.viveworks.appbase.core.service.exception.store.jpa.JpaExceptionStoreConfiguration"
        enabled: false
  defaultExpiredMessageCleanerConfiguration:
    enabled: false
defaultJmxServiceConfiguration:
  enabled: true
  excludedMxBeanRegistrations: []
defaultTracerServiceConfiguration:
  serviceName: "AppbaseService"
  tags: null
  use128BitTraceId: true
  expandExceptionLogs: true
  jaegerPropagationConfiguration:
    jaegerPropagationTypes:
      - "W3C_TRACE_CONTEXT"
    baggagePrefix: "baggage-"
  jaegerSamplerConfiguration:
    type: "com.viveworks.appbase.core.service.tracer.configuration.sampler.ConstSamplerConfiguration"
    decision: true
  jaegerReporterConfigurations:
    - type: "com.viveworks.appbase.core.service.tracer.configuration.reporter.LoggingReporterConfiguration"
      enabled: true
defaultReactiveServiceConfiguration:
  enabled: true
  schedulerConfigurations:
    - id: "Appbase-Reactor-MediatorExecutorServiceScheduler"
      defaultScheduler: true
      executorName: "appbase-reactor-scheduler-mediator-executor"
      type: "com.viveworks.appbase.core.service.reactive.reactor.scheduler.configuration.MediatorExecutorServiceSchedulerConfiguration"
