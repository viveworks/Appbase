          initialDelay: 0
          interval: 10
          timeUnit: "MINUTES"
      indexSynchronizerSchedulableConfiguration:
        enabled: true
        initialDelay: 0
        interval: 30
        timeUnit: "SECONDS"
    timestampStoredFieldName: "creationTimestamp"
    timestampLongPointName: "creationTimestampLongPoint"
    threadNameFieldName: "threadName"
    loggerNameFieldName: "loggerName"
    logLevelFieldName: "logLevel"
    formattedMessageFieldName: "formattedMessage"
    messageFieldName: "message"
    throwableTypeNameFieldName: "throwable.typeName"
    throwableMessageFieldName: "throwable.message"
    throwableStackTraceIndexEnabled: true
    throwableStackTraceFieldName: "throwable.stackTrace"
    mdcIndexEnabled: true
    mdcFieldNamePrefix: "mdc."
    mdcFieldNameSuffix: ""
    markerIndexEnabled: true
    markerFieldName: "marker"
    throwableCauseTypeNameFieldName: "throwable.cause.typeName"
    throwableCauseMessageFieldName: "throwable.cause.message"
    throwableCauseStackTraceIndexEnabled: true
    throwableCauseStackTraceFieldName: "throwable.cause.stackTrace"
    callerStackIndexEnabled: false
    callerStackFieldName: "callerStack"
  luceneAppenderConfiguration:
    enabled: false
  disruptorLogAndTurboLogEventFilterDelegatorConfiguration:
    enabled: false
    acceptLogAfterTurboLogEventListeners: true
    acceptLogAfterLogEventListeners: true
  duplicateLogTurboFilterHandlerConfiguration:
    enabled: false
    defaultLogDeduplicatorConfiguration:
      duplicateLogHandlerSchedulableConfiguration:
        enabled: true
        initialDelay: 0
        interval: 60
        timeUnit: "SECONDS"
    defaultDuplicateLogHandlerConfiguration:
      markerName: "DefaultDuplicateLogHandler"
      formattedMessageLogLevel: "INFO"
      throwableLogLevel: "ERROR"
      countTextPrefix: " (count="
      countTextSuffix: ")"
      throwableTypeNameAndMessageSeparator: " - "
      logParamsAndThrowable: true
  luceneLogAndTurboLogEventFilterListenerConfiguration:
    enabled: false
    indexTurboLog: false
    indexLogEvent: false
defaultMetricServiceConfiguration:
  enableJvmAndSystemMetrics: true
defaultValidationServiceConfiguration: {}
defaultMediatorServiceConfiguration:
  ignoredMessageTypeSet: []
  objectPoolCapacity: 256
  removedMessageQueueCapacity: 128
  appbaseRuntimeExceptionQueueCapacity: 128
  defaultMessageQueuesConfiguration:
    messageQueueType: "BOUND"
    boundMessageQueueCapacity: 256
    removeExpiredMessages: true
    expiredMessageThresholdMillis: 300000
    messageQueuesCleanerInitialDelayMillis: 5000
    messageQueuesCleanerIntervalMillis: 10000
  sharedExecutorServiceConfiguration:
    executorServiceType: "SINGLE_THREADED"
    fixedThreadPoolSize: 8
    threadNameFormat: "appbase-mediator-executor-%d"
    daemonThread: false
  sharedScheduledExecutorServiceConfiguration:
    scheduledExecutorServiceType: "SINGLE_THREADED"
    threadPoolSize: 8
    threadNameFormat: "appbase-mediator-scheduled-executor-%d"
    daemonThread: false
defaultConfigurationServiceConfiguration:
  enableSchedulableConfigurationAccessor: true
  configurationAccessorSchedulableConfiguration:
    enabled: true
    initialDelay: 0
    interval: 1000
    timeUnit: "MILLISECONDS"
defaultServiceRegistryConfiguration:
  appName: "Appbase"
  enablePolling: true
  registerAsConfigurationListener: true
  pollingSchedulableConfiguration:
    enabled: true
    initialDelay: 0
    interval: 1000
    timeUnit: "MILLISECONDS"
defaultExceptionServiceConfiguration:
