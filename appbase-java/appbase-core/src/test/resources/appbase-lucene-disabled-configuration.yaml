---
defaultDisruptorServiceConfiguration:
  waitStrategyConfiguration:
    type: "com.viveworks.appbase.core.util.disruptor.configuration.waitstrategy.SleepingWaitStrategyConfiguration"
    enabled: true
    retries: 100
    sleepTimeNanoSeconds: 1001000
  eventHandlerCount: 1
  ringBufferSize: 1024
  producerType: "MULTI"
  threadFactoryConfiguration:
    nameFormat: "disruptor-thread-%d"
    daemon: false
defaultLuceneServiceConfiguration:
  type: "com.viveworks.appbase.core.util.lucene.DefaultLuceneServiceConfiguration"
  enabled: false
  indexBaseDirectory: "/placeholder"
  directoryType: "NIO"
  mmapDirectoryConfiguration:
    maxChunkSize: 1073741824
    useUnmap: true
    preload: true
  deleteIndexPathUponShutdown: true
  checkPendingFlushUpdate: true
  commitOnClose: true
  maxBufferedDocs: 1024
  openMode: "CREATE_OR_APPEND"
  ramBufferSizeMB: 512.0
  ramPerThreadHardLimitMB: 128
  readerPooling: true
  useCompoundFile: true
  lruQueryCacheConfiguration:
    enabled: true
    maxQueries: 1000
    maxRamBytesUsed: 52428800
  standardAnalyzerStopWords: []
  standardAnalyzerMaxTokenLength: 255
  stopWordsIgnoreCase: true
  timestampBasedIndexCleanerConfiguration:
    enabled: true
    removeBeforeTimePeriod: 1
    removeBeforeTimePeriodUnit: "DAYS"
    creationTimestampFieldName: "creationTimestampLongPoint"
    schedulableConfiguration:
      enabled: true
      initialDelay: 0
      interval: 10
      timeUnit: "MINUTES"
  indexSynchronizerSchedulableConfiguration:
    enabled: true
    initialDelay: 0
    interval: 30
    timeUnit: "SECONDS"
defaultLogServiceConfiguration:
  logbackXml: null
  defaultLogAccessorConfiguration:
    enabled: false
    logStoreConfigurations:
      - type: "com.viveworks.appbase.core.service.log.store.lucene.LuceneLogStoreConfiguration"
        enabled: true
        logStoreType: "com.viveworks.appbase.core.service.log.store.lucene.LuceneLogStore"
  metricsTurboFilterHandlerConfiguration:
    enabled: true
    measureLogLevels: true
    measureLoggerNames: true
    allowedLoggerNames: []
    blockedLoggerNames: []
    measureFormattedMessages: false
    allowedFormattedMessages: []
    blockedFormattedMessages: []
    measureThrowableTypeNames: true
    allowedThrowableTypeNames: []
    blockedThrowableTypeNames: []
  burstTurboLogEventFilterHandlerConfiguration:
    enabled: true
    burstRateThreshold: 1000.0
    defaultLogDeduplicatorConfiguration:
      duplicateLogHandlerSchedulableConfiguration:
        enabled: true
        initialDelay: 0
        interval: 60
        timeUnit: "SECONDS"
    defaultLogRateCalculatorConfiguration:
      ewmaRate: "ONE_MINUTE"
    defaultDuplicateLogHandlerConfiguration:
      markerName: "DefaultDuplicateLogHandler"
      formattedMessageLogLevel: "INFO"
      throwableLogLevel: "ERROR"
      countTextPrefix: " (count="
      countTextSuffix: ")"
      throwableTypeNameAndMessageSeparator: " - "
      logParamsAndThrowable: true
  disruptorMediatorEventDelegatingAppenderConfiguration:
    enabled: true
  luceneLogIndexConfiguration:
    type: "com.viveworks.appbase.core.service.log.common.lucene.DefaultLuceneLogIndexConfiguration"
    enabled: false
    luceneServiceConfiguration:
      type: "com.viveworks.appbase.core.util.lucene.DefaultLuceneServiceConfiguration"
      enabled: true
      indexBaseDirectory: "/placeholder"
      directoryType: "NIO"
      mmapDirectoryConfiguration:
        maxChunkSize: 1073741824
        useUnmap: true
        preload: true
      deleteIndexPathUponShutdown: true
      checkPendingFlushUpdate: true
      commitOnClose: true
