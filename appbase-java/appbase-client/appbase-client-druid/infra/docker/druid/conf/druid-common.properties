druid.coordinator.asOverlord.enabled=true
druid.indexer.runner.javaOptsArray=["-server", "-Xmx64m", "-Xms64m", "-XX:MaxDirectMemorySize=64m", "-Duser.timezone=UTC", "-Dfile.encoding=UTF-8", "-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"]
druid.indexer.fork.property.druid.processing.buffer.sizeBytes=1M

druid.zk.service.host=docker.for.mac.localhost

druid.processing.numThreads=1
druid.processing.numMergeBuffers=1
druid.processing.buffer.sizeBytes=1M

druid.extensions.loadList=["druid-histogram", "druid-datasketches", "druid-lookups-cached-global", "postgresql-metadata-storage", "druid-kafka-indexing-service"]

druid.metadata.storage.host=
druid.metadata.storage.type=postgresql
druid.metadata.storage.connector.connectURI=jdbc:postgresql://docker.for.mac.localhost:5432/druid
druid.metadata.storage.connector.user=appbase
druid.metadata.storage.connector.password=password
druid.coordinator.balancer.strategy=cost

druid.storage.type=local
druid.storage.storageDirectory=/opt/druid-volume/var/segments
druid.indexer.logs.type=file
druid.indexer.logs.directory=/opt/druid-volume/var/indexing-logs

druid.startup.logging.logProperties=true
druid.emitter.logging.logLevel=debug
druid.request.logging.type=slf4j
druid.request.logging.setMDC=true
druid.request.logging.setContextMDC=true

druid.router.managementProxy.enabled=true
druid.sql.enable=true
