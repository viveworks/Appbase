druid.service=druid/historical
druid.plaintextPort=8083

# HTTP server threads
druid.server.http.numThreads=2

# Processing threads and buffers
druid.processing.buffer.sizeBytes=1M
druid.processing.numMergeBuffers=1
druid.processing.numThreads=1
druid.processing.tmpDir=/opt/druid-volume/var/druid/processing

# Segment storage
druid.segmentCache.locations=[{"path":"/opt/druid-volume/var/druid/segment-cache","maxSize":"10G"}]

# Query cache
druid.historical.cache.useCache=true
druid.historical.cache.populateCache=true
druid.cache.type=caffeine
druid.cache.sizeInBytes=100M
