---
autoStart: true
defaultDefaultVitessGrpcClientIntegrationServiceConfiguration:
  customGrpcClientFactoryConfiguration:
    retryingInterceptorConfiguration:
      enabled: true
      initialBackoffConfiguration:
        enabled: true
        time: 10
        timeUnit: "MILLISECONDS"
      maxBackoffConfiguration:
        enabled: true
        time: 2
        timeUnit: "MINUTES"
      backoffMultiplier: 1.6
    useTracing: true
    contextConfiguration:
      deadlineDuration: "PT10S"
      callerIdConfiguration: null
    nettyChannelConfiguration:
      hostPortConfiguration:
        host: "localhost"
        port: 15991
      channelFactoryInjectedTypeConfiguration: null
      channelType: "io.netty.channel.kqueue.KQueueSocketChannel"
      channelOptionsConfiguration:
        connectTimeoutMillis: 7200
        autoRead: true
        autoClose: true
        socketBacklog: 512
        socketLingerSeconds: 5
        socketReceiveBufferBytes: 87380
        socketSendBufferBytes: 16384
        socketTimeoutConfiguration: null
        socketBroadcast: false
        socketKeepAlive: true
        socketReuseAddress: false
        singleEventExecutorPerGroup: true
      channelOptionsFactoryInjectedTypeConfiguration: null
      useSharedEventLoopGroup: true
      eventLoopGroupConfiguration: null
      useDirectExecutor: true
      useSharedExecutorServiceConfiguration: true
      executorServiceConfiguration:
        executorServiceType: "FIXED"
        fixedThreadPoolSize: 30
        threadFactoryConfiguration:
          nameFormat: "appbase-vitess-executor-thread-%d"
          daemon: true
          enableThreadAffinity: true
      useSharedOffloadExecutorServiceConfiguration: true
      offloadExecutorServiceConfiguration:
        executorServiceType: "FIXED"
        fixedThreadPoolSize: 30
        threadFactoryConfiguration:
          nameFormat: "appbase-vitess-offload-executor-thread-%d"
          daemon: true
          enableThreadAffinity: true
      flowControlWindow: 1048576
      initialFlowControlWindow: 1048576
      maxInboundMessageSize: 4194304
      maxInboundMetadataSize: 8192
      maxHedgedAttempts: null
      maxRetryAttempts: null
      maxTraceEvents: null
      perRpcBufferLimit: null
      retryBufferSizeConfiguration: null
      keepAliveWithoutCalls: false
      enableRetry: null
      enableServiceConfigLookUp: true
      enableFullStreamDecompression: null
      keepAliveTimeConfiguration:
        enabled: true
        time: 1000
        timeUnit: "DAYS"
      keepAliveTimeoutConfiguration:
        enabled: true
        timeout: 20
        timeoutTimeUnit: "SECONDS"
      idleTimeoutConfiguration:
        enabled: true
        timeout: 30
        timeoutTimeUnit: "MINUTES"
      userAgent: null
      proxyDetectorInjectedTypeConfiguration: null
      localSocketPairInjectedTypeConfiguration: null
      defaultLoadBalancingPolicy: null
      compressorRegistryInjectedTypeConfiguration: null
      decompressorRegistryInjectedTypeConfiguration: null
      http2NegotiationType: "TLS"
      overrideAuthority: null
      sslClientContextConfiguration: null
      clientInterceptorListFactoryInjectedTypeConfiguration: null
      binaryLogInjectedTypeConfiguration: null
    targetConfiguration:
      keyspace: "appbase-stacktest-sharded-keyspace"
      shard: "0"
      vitessTabletType: "PRIMARY"
    tlsOptionsConfiguration: null
    callCredentialsConfiguration:
      callCredentialsInjectedTypeConfiguration: null
      staticAuthCredentialsConfiguration:
        username: "appbase-vitess-user"
        password: "password"
    loadBalancerFactoryConfiguration: null
    nameResolverFactoryConfiguration: null
